[project]
name = "lifelog-coach"
version = "0.1.0"
description = "Read your markdown life logs; let AI judge trends, red lines, and next steps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "caozhonghua" }]
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lifelog = "lifelog_coach.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifelog_coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
